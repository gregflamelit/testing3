name: Model quality assurance
on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  web:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: web
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - uses: pnpm/action-setup@v4
        with:
          version: 11.25.0
          package_json_file: web/package.json
      - run: pnpm install --frozen-lockfile
      - run: node --experimental-strip-types --test tests/*.test.ts
      - run: node node_modules/typescript/bin/tsc --noEmit
      - run: node scripts/run-framework.mjs build
  test:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    env:
      PYTHONPATH: src
      OMP_NUM_THREADS: "1"
      OPENBLAS_NUM_THREADS: "1"
      MKL_NUM_THREADS: "1"
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: requirements.lock.txt
      - run: python -m pip install -r requirements.lock.txt
      - run: python -m pytest -q --junitxml=qa-results.xml
      - run: python -m wine_lab.reproduce
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: qa-${{ matrix.os }}
          path: qa-results.xml
  container:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: docker build -t wine-lab-model .
      - name: Verify real container HTTP inference
        run: |
          docker run -d --name wine-lab -p 8000:8000 wine-lab-model
          trap 'docker logs wine-lab; docker stop wine-lab' EXIT
          for attempt in $(seq 1 30); do
            if curl -fsS http://localhost:8000/health; then break; fi
            sleep 2
          done
          curl -fsS http://localhost:8000/model
          curl -fsS http://localhost:8000/predict -H 'Content-Type: application/json' --data-binary @examples/request.json
