[build-system]
requires = ["setuptools>=75"]
build-backend = "setuptools.build_meta"

[project]
name = "wine-lab-model"
version = "1.0.0"
description = "Leakage-controlled red wine quality benchmark and champion inference service"
requires-python = ">=3.12"
dependencies = ["numpy", "pandas", "scipy", "scikit-learn", "xgboost", "catboost", "matplotlib", "fastapi", "uvicorn", "joblib", "threadpoolctl"]

[project.optional-dependencies]
test = ["pytest", "httpx"]

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
addopts = "-ra"
